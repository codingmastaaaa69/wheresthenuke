<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>wheresthenuke | Unblocked Games</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;600;700&family=Outfit:wght@400;500;600;700;800;900&display=swap" rel="stylesheet">
    <style>
        :root {
            --primary: #00FF00;
            --primary-glow: rgba(0, 255, 0, 0.15);
            --surface: #050505;
            --surface-brighter: #0f0f0f;
            --text-dim: rgba(255, 255, 255, 0.4);
        }

        [data-theme='supernova'] {
            --primary: #FF007F;
            --primary-glow: rgba(255, 0, 127, 0.15);
            --surface: #050510;
            --surface-brighter: #0a0a1a;
        }

        [data-theme='vibe'] {
            --primary: #8A2BE2;
            --primary-glow: rgba(138, 43, 226, 0.15);
            --surface: #0a0510;
            --surface-brighter: #150a20;
        }

        [data-theme='glitch'] {
            --primary: #00FFFF;
            --primary-glow: rgba(0, 255, 255, 0.15);
            --surface: #000000;
            --surface-brighter: #080808;
        }

        body {
            background-color: var(--surface);
            color: white;
            font-family: 'Outfit', sans-serif;
            transition: background-color 0.5s ease;
        }

        .text-display { font-family: 'Space Grotesk', sans-serif; }
        
        .game-card:hover {
            border-color: var(--primary);
            box-shadow: 0 0 20px var(--primary-glow);
        }

        iframe {
            background: #000;
            border-radius: 2rem;
            width: 100%;
            height: 100%;
        }

        ::-webkit-scrollbar { width: 8px; }
        ::-webkit-scrollbar-track { background: var(--surface); }
        ::-webkit-scrollbar-thumb { 
            background: var(--surface-brighter); 
            border-radius: 10px; 
        }
        ::-webkit-scrollbar-thumb:hover { background: var(--primary); }

        .theme-dot {
            width: 24px;
            height: 24px;
            border-radius: 50%;
            cursor: pointer;
            border: 2px solid transparent;
            transition: all 0.3s ease;
        }
        .theme-dot.active { border-color: white; transform: scale(1.1); }
    </style>
</head>
<body class="selection:bg-[var(--primary)] selection:text-black min-h-screen overflow-x-hidden">
    
    <!-- Header -->
    <header class="relative z-50 border-b border-white/5 backdrop-blur-xl sticky top-0 h-20">
        <div class="max-w-7xl mx-auto px-6 h-full flex items-center justify-between">
            <div class="flex items-center gap-3 cursor-pointer group" onclick="window.location.reload()">
                <div class="w-10 h-10 bg-[var(--primary)] rounded-xl flex items-center justify-center rotate-3 group-hover:rotate-0 transition-all duration-300 shadow-[0_0_20px_var(--primary-glow)]">
                    <svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="black" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><line x1="6" y1="12" x2="10" y2="12"></line><line x1="8" y1="10" x2="8" y2="14"></line><line x1="15" y1="13" x2="15.01" y2="13"></line><line x1="18" y1="11" x2="18.01" y2="11"></line><rect x="2" y="6" width="20" height="12" rx="2"></rect></svg>
                </div>
                <h1 class="text-2xl font-black tracking-tighter uppercase italic text-display">
                    wheresthenuke<span class="text-[var(--primary)]">.</span>
                </h1>
            </div>

            <div class="flex items-center gap-6">
                <!-- Theme Select -->
                <div class="flex items-center gap-2 bg-white/5 p-1.5 rounded-full border border-white/10" id="themeSwitcher">
                    <div class="theme-dot bg-[#00FF00] active" onclick="setTheme('radiation')" title="Radiation"></div>
                    <div class="theme-dot bg-[#FF007F]" onclick="setTheme('supernova')" title="Supernova"></div>
                    <div class="theme-dot bg-[#8A2BE2]" onclick="setTheme('vibe')" title="Amethyst"></div>
                    <div class="theme-dot bg-[#00FFFF]" onclick="setTheme('glitch')" title="Glitch"></div>
                </div>
                <button class="hidden md:block bg-white/5 border border-white/10 px-6 py-2.5 rounded-full text-[10px] font-black tracking-widest uppercase hover:bg-[var(--primary)] hover:text-black transition-all">
                    Sign In
                </button>
            </div>
        </div>
    </header>

    <main class="max-w-7xl mx-auto px-6 py-12 md:py-20 relative z-10" id="mainContent">
        <!-- Home View -->
        <div id="homeView">
            <div class="text-center space-y-10 mb-20">
                <div class="inline-flex items-center gap-2 bg-[var(--primary)]/10 border border-[var(--primary)]/20 px-4 py-1.5 rounded-full text-[10px] font-black text-[var(--primary)] uppercase tracking-widest">
                    <span>V2.0 LIVE TRANSMISSION</span>
                </div>
                <h2 class="text-6xl md:text-9xl font-black tracking-tighter leading-[0.8] uppercase text-display">
                    UNLIMITED<br/>
                    <span class="text-[var(--primary)] drop-shadow-[0_0_30px_var(--primary-glow)]">GAMES.</span>
                </h2>
                <div class="max-w-2xl mx-auto relative group">
                    <input type="text" id="searchInput" placeholder="Search for a game..." class="w-full bg-white/5 border border-white/10 rounded-[2rem] py-6 px-10 text-xl focus:outline-none focus:border-[var(--primary)] transition-all">
                </div>
            </div>

            <div class="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-4 gap-8" id="gamesGrid">
                <!-- Games appear here -->
            </div>
        </div>

        <!-- Player View -->
        <div id="playerView" class="hidden space-y-8">
            <div class="flex items-center justify-between">
                <button onclick="showHome()" class="flex items-center gap-2 text-white/40 hover:text-[var(--primary)] text-[10px] font-black uppercase tracking-widest transition-colors">
                    <svg xmlns="http://www.w3.org/2000/svg" width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"><line x1="18" y1="6" x2="6" y2="18"></line><line x1="6" y1="6" x2="18" y2="18"></line></svg>
                    Abort Mission
                </button>
                <div class="flex items-center gap-4">
                    <h2 id="currentGameTitle" class="text-4xl font-black tracking-tighter uppercase italic text-display"></h2>
                    <button onclick="toggleFullscreen()" class="p-3 bg-white/5 border border-white/10 rounded-xl hover:text-[var(--primary)] transition-all">
                        <svg xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M8 3H5a2 2 0 0 0-2 2v3m18 0V5a2 2 0 0 0-2-2h-3m0 18h3a2 2 0 0 0 2-2v-3M3 16v3a2 2 0 0 0 2 2h3"></path></svg>
                    </button>
                </div>
            </div>
            <div class="aspect-video w-full bg-black/50 border border-white/10 rounded-[3rem] overflow-hidden shadow-2xl shadow-[var(--primary-glow)]">
                <iframe id="gameIframe" src="" frameborder="0" allowfullscreen></iframe>
            </div>
        </div>
    </main>

    <footer class="mt-20 border-t border-white/5 py-20 px-6">
        <div class="max-w-7xl mx-auto flex flex-col md:flex-row justify-between items-start gap-12">
            <div class="space-y-6">
                <h3 class="text-2xl font-black italic text-display">wheresthenuke</h3>
                <p class="text-white/20 text-xs font-bold uppercase tracking-widest max-w-sm">Secure game delivery network. Serving unblocked entertainment since 2024.</p>
            </div>
            <div class="flex gap-20">
                <div class="space-y-4">
                    <p class="text-[10px] font-black text-[var(--primary)] tracking-widest uppercase">Network</p>
                    <nav class="flex flex-col gap-2 text-xs font-bold text-white/30 uppercase tracking-widest">
                        <a href="#" class="hover:text-white transition-colors">Discord</a>
                        <a href="#" class="hover:text-white transition-colors">X / Twitter</a>
                    </nav>
                </div>
                <div class="space-y-4">
                    <p class="text-[10px] font-black text-[var(--primary)] tracking-widest uppercase">Protocol</p>
                    <nav class="flex flex-col gap-2 text-xs font-bold text-white/30 uppercase tracking-widest">
                        <a href="#" class="hover:text-white transition-colors">Privacy</a>
                        <a href="#" class="hover:text-white transition-colors">Terms</a>
                    </nav>
                </div>
            </div>
        </div>
    </footer>

    <script src="script.js"></script>
</body>
</html>
